# dionysus bimanual UR5e rig — single source of truth for frames, IPs and limits.
#
# World frame = the uksang calibration "checkerboard" frame (origin at the first
# internal board corner, +Z up from the table). Calibration solved 2026-08-01
# (datasets/run_002); re-run the uksang calibration if a camera or arm mount moved.
#
# arm_id: GaP arm index. 0 is the work arm (r2s2r graphs drive arm 0 by default).

surface_z: 0.0            # table top in world [m]; refine from a depth plane fit (rig_snapshot --plane)

arms:
  right:
    arm_id: 0
    ip: 192.168.0.13
    calib: calib/right_follower_arm_handeye.yaml
    base_frame: right_follower_arm_base
    # flange -> the 2F-85's tool point, flange frame; the fingertips are 4.4 mm further (GaP's tip_reach).
    # x, y: imit_ur5 fit vs actual_TCP_pose (1775 frames, 1.2 mm residual). z: the r2s2rn twin's tool point;
    # both wrist cameras' depth put the real fingertips 159-161 mm out (2026-10-20). The controller's own TCP
    # (174.6 mm, the old value) sits 14 mm beyond them, so the driver's tcp_offset cross-check warns: expected.
    tcp_offset: [-0.0021, 0.0003, 0.1558]
    home_q: [-2.50619, -1.76457, -1.82408, -1.67229, 0.92316, 0.80128]
    home_gripper: 0.0118
    joint_limits: [-6.2831853, 6.2831853]
  left:
    arm_id: 1
    ip: 192.168.0.11
    calib: calib/left_follower_arm_handeye.yaml
    base_frame: left_follower_arm_base
    tcp_offset: [-0.0021, 0.0003, 0.1558]
    home_q: [2.52962, -1.43099, 1.82276, -1.46117, -0.95871, -0.82522]
    home_gripper: 0.0118
    joint_limits: [-6.2831853, 6.2831853]

cameras:
  top:
    serial: CV3H46000036
    mount: fixed
    calib: calib/top_camera.yaml
    link_frame: top_camera_link
  bottom:
    serial: CV3H4600001A
    mount: fixed
    calib: calib/bottom_camera.yaml
    link_frame: bottom_camera_link
  right_wrist:
    serial: CV3H46000012
    mount: right
    calib: calib/right_follower_arm_handeye.yaml
    parent_frame: right_follower_arm_tool0
    link_frame: right_wrist_camera_link
  left_wrist:
    serial: CV3H4600008Z
    mount: left
    calib: calib/left_follower_arm_handeye.yaml
    parent_frame: left_follower_arm_tool0
    link_frame: left_wrist_camera_link

# TCP workspace box in world [m]. Every planned waypoint's TCP must stay inside.
# Set conservatively around the table; widen only after checking in viser.
# Home TCPs (calibrated FK): right (0.01, 0.61, 0.45), left (0.00, -0.04, 0.45);
# arm bases at x~0.5; the top camera looks at ~(0.0, 0.28, 0.0).
workspace:
  min: [-0.40, -0.25, 0.0]      # z: the tool point on the table top puts the fingertips 4.4 mm under it (was
  max: [0.45, 0.85, 0.70]       # -0.025 for the old tool point, 14 mm beyond the real fingertips; 2026-10-20)

# Clearance gates (metres) applied to every planned waypoint.
clearance:
  tcp_above_surface: 0.0       # TCP never below surface_z + this: the fingertips may reach the mat (its top 1-8 mm up)
  links_above_surface: 0.04    # DH frame origins (wrists, flange) above surface_z + this
  inter_arm: 0.12              # min distance between the two arms' link segments
