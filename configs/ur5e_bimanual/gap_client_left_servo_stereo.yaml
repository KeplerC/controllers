# dionysus rig — as gap_client_left_servo_hub.yaml, with the cameras streaming their colour pairs ("Dual Color Streams")
# and their depth from r2s2rn's Fast-FoundationStereo server (ffs/<camera>), which `r2s2rn rig up --config left_servo_stereo` starts.
# dionysus rig — GaP client, LEFT arm DRIVEN through "gap servo" at slider 0.10, right arm READ-ONLY; the r2s2rn hub is the view.
# Pre-flight: Phase 0 checklist; the left pendant needs Remote + "gap servo" loaded and STOPPED
# (load "Default program" back on the pendant afterwards; the vendor teleop expects it).
version: "1"
session:
  record_topic: ur_client/record   # the hub's `record start|stop` (studio/record -> the client -> here)
  save_root: /home/lab/eric/data/recordings

nodes:
  - type: AgentNode
    name: ur_client
    agent_class: robots_realtime.agents.client.ur_bimanual_client:URBimanualClientAgent
    loop_mode: fixed_rate
    poll_freq: 100
    multi_arm_topics: true
    agent_kwargs:
      gap_port: 9000
      viser_port: null   # the r2s2rn hub (:8080) is the view
      camera_period_s: 0.2
      stale_after_s: 0.25
    extra_topics:            # the hub's answers over the bus (r2s2rn relay)
      studio_ack: studio/viz_ack
      studio_stop: studio/stop
      studio_record: studio/record
    state_topics:
      right: ur_right/joint_state
      left: ur_left/joint_state
    image_topics:
      top: cams/top
      bottom: cams/bottom
      right_wrist: cams/right_wrist
      left_wrist: cams/left_wrist

  - type: RobotNode
    name: ur_right
    robot_config: robot_configs/ur5e/right.yaml
    poll_freq: 125
    cmd_topic: ur_client/right_pos
    cmd_timeout_s: 0.2

  - type: RobotNode
    name: ur_left
    robot_config: robot_configs/ur5e/left_servo.yaml   # speed fraction 0.30, ramp-tested 2026-10-19; at 0.10 a 49 cm move outran the driver's time budget (2026-10-20)
    poll_freq: 125
    cmd_topic: ur_client/left_pos
    cmd_timeout_s: 0.2

  # All four Orbbec cameras in ONE process: the SDK does not share GMSL cameras
  # across processes (see robots_realtime/runtime/environment/orbbec_rig_node.py).
  - type: OrbbecRigNode
    name: cams
    width: 848
    height: 530
    fps: 15
    poll_freq: 30
    publish_freq: 10   # bus rate per camera; recording still gets every frame
    enable_depth: true   # overridden by stereo
    stereo: true
    stereo_freq: 2.0
    depth_topic: ffs
    work_mode: Default
    cameras:
      - {camera: top, serial: "CV3H46000036"}
      - {camera: bottom, serial: "CV3H4600001A"}
      - {camera: right_wrist, serial: "CV3H46000012"}
      - {camera: left_wrist, serial: "CV3H4600008Z"}
